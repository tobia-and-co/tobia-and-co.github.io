name: Benny il Benzinaio
# In pausa: il sito del Ministero non risponde ai server di GitHub (esteri).
# I dati arriveranno dal mini PC in Italia; per ora si avvia solo a mano.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prezzi:
    if: github.repository == 'tobia-and-co/tobia-and-co.github.io'   # solo sul sito vero, mai nelle copie
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/benny_carburanti.py
      - run: if [ -f scripts/benny_pagine.py ]; then python3 scripts/benny_pagine.py; fi
      - name: Salva i prezzi
        run: |
          git config user.name "Benny il Benzinaio (Tobia & Co.)"
          git config user.email "tobia.and.co@proton.me"
          git add data/carburanti carburante 2>/dev/null || git add data/carburanti
          git diff --cached --quiet || (git commit -m "Benny: prezzi dei carburanti aggiornati [CF-Pages-Skip]" && for i in 1 2 3 4; do git pull --rebase -q && git push && break; sleep 7; done)
