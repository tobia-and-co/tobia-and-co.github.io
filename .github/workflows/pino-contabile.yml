name: Pino il Contabile
on:
  schedule:
    - cron: "42 7 * * *"   # ogni giorno
  workflow_dispatch:
  push:
    paths: [".github/workflows/pino-contabile.yml", "scripts/pino_cassa.py", "scripts/pino_controlla_benny.py"]
permissions:
  contents: write
  issues: write
jobs:
  conti:
    if: github.repository == 'tobia-and-co/tobia-and-co.github.io'   # solo sul sito vero, mai nelle copie
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/pino_cassa.py
      - name: Salva i conti
        run: |
          git config user.name "Pino il Contabile (Tobia & Co.)"
          git config user.email "tobia.and.co@proton.me"
          git add data/cassa.json data/visite.json
          git diff --cached --quiet || (git commit -m "Pino: conti della cassa aggiornati" && for i in 1 2 3 4; do git pull --rebase -q && git push && break; sleep 7; done)
      - name: Controlla che i prezzi dei carburanti arrivino
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/pino_controlla_benny.py
