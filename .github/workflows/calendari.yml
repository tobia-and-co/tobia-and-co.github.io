name: Calendari in abbonamento
on:
  schedule:
    - cron: "11 4 1 * *"   # ogni mese, così "l'anno prossimo" scorre in avanti
  workflow_dispatch:
permissions:
  contents: write
jobs:
  calendari:
    if: github.repository == 'tobia-and-co/tobia-and-co.github.io'   # solo sul sito vero, mai nelle copie
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/calendari.py
      - name: Salva i calendari
        run: |
          git config user.name "Tobia & Co."
          git config user.email "tobia.and.co@proton.me"
          git add calendari
          git diff --cached --quiet || (git commit -m "Calendari aggiornati [CF-Pages-Skip]" && for i in 1 2 3 4; do git pull --rebase -q && git push && break; sleep 7; done)
