name: Vera la Collaudatrice
on:
  push:
  schedule:
    - cron: "24 8 * * *"   # ogni giorno
  workflow_dispatch:
jobs:
  collauda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: node scripts/vera_collauda.js
